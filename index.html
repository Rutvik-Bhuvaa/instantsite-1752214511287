<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import React from 'react';
    import ReactDOM from 'react-dom/client';

    function Square({ value, onSquareClick }) {
      return (
        <button
          className="bg-gray-100 border-2 border-gray-300 rounded-md w-24 h-24 text-5xl font-bold hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-200"
          onClick={onSquareClick}
        >
          {value}
        </button>
      );
    }

    function Board({ squares, onPlay }) {
      function handleClick(i) {
        if (squares[i] || calculateWinner(squares)) {
          return;
        }
        const nextSquares = squares.slice();
        if (xIsNext) {
          nextSquares[i] = "X";
        } else {
          nextSquares[i] = "O";
        }
        onPlay(nextSquares);
      }

      const winner = calculateWinner(squares);
      let status;
      if (winner) {
        status = "Winner: " + winner;
      } else if (squares.every(square => square !== null)) {
        status = "It's a draw!";
      }
       else {
        status = "Next player: " + (xIsNext ? "X" : "O");
      }

      const [xIsNext, setXIsNext] = React.useState(true);

      return (
        <div>
          <div className="text-2xl font-semibold mb-4">{status}</div>
          <div className="grid grid-cols-3 gap-2">
            <Square value={squares[0]} onSquareClick={() => handleClick(0)} />
            <Square value={squares[1]} onSquareClick={() => handleClick(1)} />
            <Square value={squares[2]} onSquareClick={() => handleClick(2)} />
            <Square value={squares[3]} onSquareClick={() => handleClick(3)} />
            <Square value={squares[4]} onSquareClick={() => handleClick(4)} />
            <Square value={squares[5]} onSquareClick={() => handleClick(5)} />
            <Square value={squares[6]} onSquareClick={() => handleClick(6)} />
            <Square value={squares[7]} onSquareClick={() => handleClick(7)} />
            <Square value={squares[8]} onSquareClick={() => handleClick(8)} />
          </div>
        </div>
      );
    }

    function Game() {
      const [history, setHistory] = React.useState([Array(9).fill(null)]);
      const [currentMove, setCurrentMove] = React.useState(0);
      const xIsNext = currentMove % 2 === 0;
      const currentSquares = history[currentMove];

      function handlePlay(nextSquares) {
        const nextHistory = [...history.slice(0, currentMove + 1), nextSquares];
        setHistory(nextHistory);
        setCurrentMove(nextHistory.length - 1);
      }

      function jumpTo(move) {
        setCurrentMove(move);
      }

      const moves = history.map((squares, move) => {
        let description;
        if (move > 0) {
          description = 'Go to move #' + move;
        } else {
          description = 'Go to game start';
        }
        return (
          <li key={move}>
            <button className="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" onClick={() => jumpTo(move)}>{description}</button>
          </li>
        );
      });

      return (
        <div className="flex flex-col items-center justify-center h-screen bg-gray-50">
          <div className="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
            <h1 className="text-3xl font-bold mb-6 text-center">Tic Tac Toe</h1>
            <div className="flex">
              <div>
                <Board squares={currentSquares} onPlay={handlePlay} />
              </div>
              <div className="ml-8">
                <ul className="space-y-2">{moves}</ul>
              </div>
            </div>
          </div>
        </div>
      );
    }


    function calculateWinner(squares) {
      const lines = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6]
      ];
      for (let i = 0; i < lines.length; i++) {
        const [a, b, c] = lines[i];
        if (squares[a] && squares[a] === squares[b] && squares[a] === squares[c]) {
          return squares[a];
        }
      }
      return null;
    }


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Game />);
  </script>
</body>
</html>
